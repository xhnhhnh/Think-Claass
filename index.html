<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      No <link rel="icon"> here on purpose: the mark is defined once, in src/lib/brandIcon.ts, and
      SiteSettingsBootstrap points the tab at it (or at the superadmin's uploaded site_favicon).
      A static link would be a second copy of the same artwork.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Think-Class 课堂成长记录与协作平台：成长记录、合作任务、课堂挑战与家校沟通，让每一份进步都被看见。"
    />
    <meta name="theme-color" content="#17583E" />
    <title>Think-Class</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--__TC_CONFIG__-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
