# Think-Class HTTPS 反向代理模板（证书走 certbot，不由本文件签发）
#
# 为什么需要它：仓库里**没有任何 TLS 配置**。`install.sh` 写的
# `/etc/nginx/conf.d/think-class.conf` 是 `listen 80;` 的纯 HTTP 反代，`api/server.ts` 也只用
# `app.listen()` 起 HTTP；而小程序要求请求域名必须是 HTTPS。所以 HTTPS 只能在 Nginx 这一层补。
#
# 用法（Ubuntu/Debian，root）：
#
#   # 1) 先按 Track B 文档跑完 install.sh，域名解析到本机
#   # 2) 签发证书（webroot 模式，本文件 80 端口块里已经留好校验目录）
#   sudo mkdir -p /var/www/certbot
#   sudo certbot certonly --webroot -w /var/www/certbot -d <你的域名>
#   # 3) 用本模板替换安装器生成的 HTTP 配置（把占位符一次替换掉）
#   sudo sed 's/<DOMAIN>/<你的域名>/g' deploy/nginx/think-class-https.conf \
#     | sudo tee /etc/nginx/conf.d/think-class.conf > /dev/null
#   sudo nginx -t && sudo systemctl reload nginx
#
# 用 `certonly` 而不是 `certbot --nginx` 是故意的：后者会重写这个文件，
# 于是"站点配置在哪里、长什么样"就取决于 certbot 什么时候跑过一次。证书续期用
# `certbot renew`（它只换文件，不需要动本配置），重载钩子见 docs/wechat/20-deploy-selfhosted.md。
#
# 注意：本仓库的应用**没有**开启 Express 的 `trust proxy`（全仓库没有相关设置），
# 所以 `X-Real-IP` / `X-Forwarded-For` 虽然照常转发，`req.ip` 记录的仍是 127.0.0.1（代理由本机发起）。
# 登录与审计日志里的 IP 字段因此不准确 —— 这是已知限制，不是本模板能修的。

# ---- HTTP：只做跳转 + ACME 校验 ----
server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    # certbot --webroot 的校验路径必须在跳转之前放行，否则续期会失败
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS：反代到应用 ----
server {
    # `http2` 写在 listen 上是老写法，但它是唯一在 nginx 1.18（Ubuntu 22.04 自带）到 1.25
    # 之间都有效的写法。如果你的 nginx >= 1.25.1，可以换成 `listen 443 ssl;` + `http2 on;`
    # 消除弃用告警 —— 不换也能跑。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <DOMAIN>;

    # certbot 的 live 目录是软链接，让 nginx 在 reload 时读到最新证书。
    # 用 fullchain.pem，不要用 cert.pem：cert.pem 不含中间证书，Android / iOS 真机会
    # 报"证书链不完整"，而开发者工具往往看不出来。
    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;

    # 小程序要求 TLS 1.2 及以上。显式写死，别依赖发行版默认值（老版本可能仍开着 TLS 1.0/1.1）。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS：只在这个 HTTPS 块里加（HTTP 块加了没有意义）。
    # 先不加 includeSubDomains/preload：一旦浏览器记住，回退到 HTTP 就不是你能单方面决定的了。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 拍照题的图片上传（学生作业照片）。应用侧的上限是 10MB
    # （`MAX_PHOTO_BYTES`，plugins/homework/src/homework.service.ts），
    # 而 nginx 默认 client_max_body_size 只有 1m —— 不设这一行，稍大的手机照片会得到 413，
    # 而且是 Nginx 直接拒绝，应用日志里什么都看不到。12m 给 multipart 边界留了余量。
    client_max_body_size 12m;

    # 应用自己会提供 /uploads 下的上传文件（api/app.ts），不要另配 location 指向磁盘目录，
    # 否则两套路径规则会分叉。
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 与应用端的端口保持一致：install.sh 里端口可能被自动改过
        # （AUTO_PICK_PORT），以 `/class/.env` 的 PORT 为准。

        # AI 出题/批改这类请求会同步等待上游模型，60s 的默认值偏紧。
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
