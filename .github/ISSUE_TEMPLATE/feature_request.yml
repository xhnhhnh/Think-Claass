name: "功能建议 / Feature request"
description: "提出一个具体、可评估的功能改进建议。 / Propose a concrete, assessable improvement."
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        **提交前请确认 / Before you start:**

        - 这是功能建议，不是故障报告：故障请用 Bug 表单；漏洞请走私密渠道：[SECURITY.md](https://github.com/xhnhhnh/Think-Claass/blob/main/SECURITY.md) ([简体中文](https://github.com/xhnhhnh/Think-Claass/blob/main/SECURITY.zh-CN.md))。
        - 请先搜索[已有 issue](https://github.com/xhnhhnh/Think-Claass/issues)，并说明这个需求面向哪个端、解决什么问题。
        - 不要在 issue 里粘贴真实学生姓名、成绩、照片或其他个人信息，用虚构示例代替。

        This form is for proposals, not bug reports. Security issues go through SECURITY.md privately. Search existing issues first, and never paste real student data.

  - type: textarea
    id: problem
    attributes:
      label: "问题 / Problem"
      description: "现在哪里不好用或缺失？谁受影响（教师、学生、家长、管理员）？ / What is hard or missing today, and who is affected (teacher, student, parent, administrator)?"
      placeholder: "作为一名……，我在……时遇到…… / As a ..., I find ... when ..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "建议方案 / Proposed solution"
      description: "你希望它怎么工作？如果涉及接口、插件、数据模型或权限，请一并说明。 / How should it work? Mention APIs, plugins, data model or permissions if relevant."
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: "涉及范围 / Scope"
      description: "勾选这个功能会触碰的部分，便于维护者判断影响面。 / Tick the parts this feature would touch so maintainers can size it."
      options:
        - label: "教师端 / Teacher console"
        - label: "学生端 / Student console"
        - label: "家长端 / Parent console"
        - label: "管理端 / Superadmin console"
        - label: "后端插件 / Backend plugin"
        - label: "微信小程序 / WeChat mini program"
        - label: "文档 / Documentation"
        - label: "部署与发布 / Deployment and release"

  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案 / Alternatives considered"
      description: "你考虑过哪些替代做法，为什么没有采用？ / What alternatives did you consider, and why are they worse?"

  - type: textarea
    id: additional-context
    attributes:
      label: "补充信息 / Additional context"
      description: "截图、相关 issue、草图等；请遮挡学生个人信息。 / Screenshots, related issues, sketches. Cover any student personal data."
