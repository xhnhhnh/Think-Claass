# Release pipeline: a tag becomes a downloadable, verifiable artifact.
#
# Why this file exists at all: before the version-management round the repository had no workflow,
# every GitHub Release had an empty `assets` array, and the deployed instances' updater downloaded
# `releases/latest/download/think-class-release.zip` - which therefore 404'd on every attempt. The
# auto-update feature had never once worked, and nothing failed when it didn't (docs/versioning.md
# section 9). A tag push is now the single release event, and this workflow is what turns it into
# something a deployment can actually install.
#
# The gates run here rather than only on the developer's machine because the artifact must be built
# from a commit that passed them: hand-packaging cannot promise that, which is how pack.sh managed to
# ship a package that omitted `packages/` and `plugins/` altogether.

name: release

on:
  push:
    # Glob, not a regular expression: GitHub matches these with fnmatch, so the regex form
    # 'v[0-9]+.[0-9]+.[0-9]+' never fires - `+` is a literal there. That mistake is why v2.0.0 was
    # pushed and produced no run at all, which is exactly the "nothing fails when it doesn't work"
    # pattern this pipeline exists to end.
    tags:
      - 'v*'
  # Re-build a release for an existing tag without touching the tag: used to repair a failed run, and
  # to publish the first artifact for a tag that predates this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # The version gate below inspects tags, and `gh release create` needs the full history.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: API surface must not drift
        run: npm run api:surface -- --check

      - name: Guardrails
        run: npm run guard

      # The full suite, including the suites that boot a real plugin host and a real server.
      - name: Test
        run: npm test

      # `pack.sh` builds the frontend itself (`npm run build`) and then assembles the release tree.
      # It is the same script a maintainer runs locally, so there is one definition of "what a
      # release contains" - including `packages/` and `plugins/`, which G19 keeps in the list.
      - name: Build the release archive
        run: bash pack.sh

      # The archive must actually contain the running system, not just build output. `pack.sh` shipped
      # dist/api/prisma and omitted `packages/` and `plugins/` for the whole plugin refactor - a release
      # that boots a server with no kernel and no domains - and nothing noticed because nothing looked.
      # G19 asserts the copy lines are still in the script; this asserts the packaged file list, which is
      # the thing that is downloaded.
      - name: The archive contains the runtime tree
        run: |
          set -euo pipefail
          unzip -l think-class-release.zip > archive-contents.txt
          missing=0
          for entry in \
            api/server.ts \
            packages/kernel/src/index.ts \
            packages/plugin-runtime/src/index.ts \
            packages/plugin-sdk/src/index.ts \
            plugins/admin/plugin.json \
            plugins/classroom/plugin.json \
            dist/index.html \
            install.sh \
            update.sh \
            package.json
          do
            if ! grep -q " ${entry}$" archive-contents.txt; then
              echo "::error::release archive is missing ${entry}"
              missing=$((missing + 1))
            fi
          done
          plugins=$(grep -cE ' plugins/[^/]+/plugin\.json$' archive-contents.txt || true)
          echo "plugins packaged: ${plugins}"
          echo "archive entries: $(grep -cE '^ *[0-9]+ ' archive-contents.txt || true)"
          [ "$missing" -eq 0 ] || exit 1
          [ "$plugins" -ge 20 ] || { echo "::error::expected the full plugin set, found ${plugins}"; exit 1; }

      - name: Checksums
        run: sha256sum think-class-release.zip > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          prerelease=""
          case "$tag" in
            *-rc.*) prerelease="--prerelease" ;;
          esac

          # Release notes: the CHANGELOG section for this version when it exists, otherwise a
          # pointer to it. An empty release body is worse than a short one.
          notes_file="$(mktemp)"
          node - "$tag" > "$notes_file" <<'NODE'
          const fs = require('node:fs');
          const tag = process.argv[2];
          const version = tag.replace(/^v/, '');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const start = changelog.indexOf(`## [${version}]`);
          if (start === -1) {
            console.log(`Release ${version}. See CHANGELOG.md for what changed.`);
            process.exit(0);
          }
          const rest = changelog.slice(start);
          const next = rest.indexOf('\n## [', 1);
          console.log(next === -1 ? rest.trim() : rest.slice(0, next).trim());
          NODE

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" think-class-release.zip SHA256SUMS --clobber
            gh release edit "$tag" --notes-file "$notes_file" $prerelease
          else
            gh release create "$tag" think-class-release.zip SHA256SUMS \
              --title "Think-Class $tag" \
              --notes-file "$notes_file" \
              $prerelease
          fi

      - name: Summary
        run: |
          {
            echo "### Release ${RELEASE_TAG}"
            echo
            echo "| artifact | bytes |"
            echo "| --- | --- |"
            echo "| think-class-release.zip | $(stat -c %s think-class-release.zip) |"
            echo "| SHA256SUMS | $(stat -c %s SHA256SUMS) |"
            echo
            cat SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
